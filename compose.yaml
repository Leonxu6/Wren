# Wren 单实例部署(W5)。bot(对话 + 夜结算 + 主动调度)+ metrics(监测灌库循环)。
# 数据挂卷 = 关系命脉,务必备份(scripts/backup.sh + cron)。⚠️ 单实例:勿对 bot 做 scale > 1。
services:
  bot:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data # per-user 关系状态 + trace(命脉)
      - ./world:/app/world # 共享 life skeleton(today.md 运行期 + life_arcs.md 种子)
    stop_grace_period: 30s

  metrics:
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data # 只读消费 trace → 写 data/metrics.duckdb
      - ./world:/app/world
    # 跑在 bot 进程外(故障隔离);每 ~15min 增量幂等灌库。
    # 失败处理(#24):不再 `|| true` 永久吞失败 —— 连续 3 次失败 → exit 1,
    # 让 restart: always + healthcheck 把"metrics DB 静默陈旧"暴露成 docker ps unhealthy 信号。
    command:
      - sh
      - -c
      - |
        fail=0
        while true; do
          if uv run wren-metrics ingest; then
            fail=0
          else
            fail=$((fail+1))
            echo "⚠️  ingest 失败 (连续 $fail/3)" >&2
            if [ "$fail" -ge 3 ]; then
              echo "✗ ingest 连续 3 次失败,退出让 restart 暴露问题(#24)" >&2
              exit 1
            fi
          fi
          sleep 900
        done
    # healthcheck:metrics.duckdb 30min 内有修改 = healthy;否则 ingest 静默陈旧 → unhealthy。
    # interval=5m + retries=2 → 失败窗口 ≤ 10min,远小于 30min mtime 阈值;启动 25min 宽限。
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /app/data/metrics.duckdb -mmin -30 2>/dev/null)\""]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 25m

  viewer:
    # W8 运维平台:健康总览 / 用户列表 / 单用户时间线(每轮内心 + 夜结算重写)。
    # 隐私铁律:绑 127.0.0.1 + before_request 拒非 localhost,SSH 隧道访问(绝不公网)。
    build: .
    restart: always
    env_file: .env
    volumes:
      - ./data:/app/data # 读 trace.jsonl/settlement.jsonl + metrics.duckdb
      - ./world:/app/world
      - /srv/wren-backups:/srv/wren-backups:ro # W8.1 修:让 viewer 能看到上次备份大小+时间
      # 不挂 /var/run/docker.sock(#22):`:ro` 只防 fs 写,不约束 Docker API 动词;
      # 一旦 viewer compromise,blast radius 会从"读 ops 数据"升级到"宿主 Docker 控制面"。
      # `container_status()` 在 socket 不存在时已 fail-safe 返回 "unknown",dashboard 仍可渲染。
      # 若以后真需要容器状态,走 docker-socket-proxy sidecar 只暴露 read-only endpoint。
    # network_mode=host: 容器共享 host net ns,bind 127.0.0.1 = host 127.0.0.1。
    # 不用 docker port mapping(那会让容器看到 bridge IP,触发我们的 remote_addr 拒绝中间件)。
    # 外部公网到 host 8002 直接 connection refused(viewer 不在 0.0.0.0 上 listen)。
    network_mode: host
    command: ["uv", "run", "wren-view"]
    # web.py SAFETY:命令行传 --host 0.0.0.0 也会被强制改回 127.0.0.1(隐私铁律,绝不可暴露公网)。
