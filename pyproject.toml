[project]
name = "wren"
version = "0.1.0"
description = "Wren — 英文 AI 关系模拟 Telegram bot(Phase 0 eval + walking skeleton)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-telegram-bot[job-queue]>=21,<22",  # [job-queue]:夜结算 run_daily + debounce 都靠 JobQueue
    "pyyaml>=6",
    "python-dotenv>=1",
    "flask>=3.0",  # W8 viewer(运维平台,绑 127.0.0.1 + SSH 隧道);仅 wren-view 用,不进 bot/metrics 热路径
]

[project.scripts]
wren-harness = "wren.eval.harness:main"
wren-multiturn = "wren.eval.multiturn:main"
wren-aliveness = "wren.eval.aliveness:main"
wren-bot = "wren.bot.app:main"
wren-nightly = "wren.bot.nightly:main"
wren-metrics = "wren.ops.cli:main"  # W6 监测库 CLI(只读消费 data/,跑在 bot 进程外)
wren-view = "wren.ops.web:main"  # W8 运维平台(Flask,127.0.0.1:8002 + SSH 隧道;隐私铁律守住)

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "duckdb>=1.1",  # W6 监测库(ops/);仅 wren-metrics 用,不进 bot 运行期热路径
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# 全仓 `ruff check .` 是发布 gate(README / CLAUDE.md / RUNBOOK D4 / scripts/deploy.sh)。
# 这里显式排除一次性发布素材包目录——它放截图 / broll / 视频脚本 / 一次性生成脚本,
# 不属于产品质量门禁面;否则那些 WIP 脚本会让全仓 gate 红、阻断 deploy 预检(见 #9)。
extend-exclude = ["tasks/wren_distribution_recap_package"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # 行长由 formatter 处理;voice 样本/prompt 可能长

[tool.mypy]
python_version = "3.11"
packages = ["wren"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["telegram.*", "apscheduler.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
