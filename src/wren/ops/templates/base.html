<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{% block title %}Wren · 运维平台{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
{% block extra_head %}{% endblock %}
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="logo">🐦</span><span class="brand-text">Wren <small>ops</small></span>
  </div>
  <nav class="nav">
    <a href="/" class="{% if request.path == '/' %}active{% endif %}"><span class="ic">🏠</span><span>总览</span></a>
    <a href="/users" class="{% if request.path.startswith('/users') or request.path.startswith('/u/') %}active{% endif %}"><span class="ic">👤</span><span>用户</span></a>
    <a href="/levels" class="{% if request.path == '/levels' %}active{% endif %}"><span class="ic">📊</span><span>等级</span></a>
    <a href="/sources" class="{% if request.path == '/sources' %}active{% endif %}"><span class="ic">🔗</span><span>来源</span></a>
    <a href="/cost" class="{% if request.path == '/cost' %}active{% endif %}"><span class="ic">💰</span><span>成本</span></a>
    <a href="/nightly" class="{% if request.path == '/nightly' %}active{% endif %}"><span class="ic">🌙</span><span>夜结算</span></a>
    <a href="/errors" class="{% if request.path == '/errors' %}active{% endif %}"><span class="ic">⚠️</span><span>错误</span></a>
    <a href="/system" class="{% if request.path == '/system' %}active{% endif %}"><span class="ic">⚙️</span><span>系统</span></a>
  </nav>
  <div class="nav-foot">
    <div class="iron-law">隐私铁律<br><small>原文仅本机渲染</small></div>
  </div>
</aside>
<div class="main">
  <header class="topbar">
    <div class="crumb">{% block crumb %}{% endblock %}</div>
    <div class="topbar-right">
      <span class="badge ok">●  bind 127.0.0.1</span>
      <span class="topbar-time" id="topbar-time"></span>
      <button class="refresh-btn" onclick="location.reload()" title="刷新">↻</button>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script>
  // topbar 实时时钟
  (function tick() {
    const el = document.getElementById('topbar-time');
    if (el) {
      const d = new Date();
      el.textContent = d.toLocaleString('zh-CN', { hour12: false });
    }
    setTimeout(tick, 1000);
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
